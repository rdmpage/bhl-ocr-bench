[project]
name = "bhl-ocr-bench"
version = "0.1.0"
description = "Producer adapters that feed OCR engines into the pinned finebooks/bhl-ocr-eval scorer."
requires-python = ">=3.10"
dependencies = [
    # beautifulsoup4: the surya-ocr-2 producer flattens the engine's per-block HTML to text with
    # it. The producer itself runs from surya-env (torch needs its own venv), but it is a real
    # dependency of this repo's code and its tests, so it is declared here too.
    "beautifulsoup4",
    "datasets>=3",
    "huggingface-hub>=0.28",
    "pandas",
    "pyarrow",
    "pillow",
    "pytesseract",
    "requests",
]

[dependency-groups]
dev = ["pytest", "responses"]

# Reproducibility: pin the index and a fixed resolution cutoff so every machine locks identically,
# matching the harness's own policy. Bump deliberately when newer deps are wanted.
[tool.uv]
exclude-newer = "2026-08-01T00:00:00Z"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["producers", "scripts"]
testpaths = ["tests"]
